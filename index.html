<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sternwarte-Planer – Beobachtungsplanung für Sternwarte und Kuppel" />
    <title>Sternwarte-Planer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #060a16;
        --text: #8b93ad;
        --text-h: #eef1f8;
        --accent: #6d8bff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: radial-gradient(ellipse at top, #13204a 0%, var(--bg) 60%);
        color: var(--text);
        font: 16px/1.5 system-ui, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.5rem;
        color: var(--text-h);
        font-size: clamp(2rem, 6vw, 3rem);
        font-weight: 600;
      }

      .badge {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.3rem 0.9rem;
        border: 1px solid var(--accent);
        border-radius: 999px;
        color: var(--accent);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sternwarte-Planer</h1>
      <p>Beobachtungsplanung für Sternwarte und Kuppel.</p>
      <span class="badge">In Entwicklung</span>
    </main>
  </body>
</html>
